apiVersion: shrine/v1
kind: Resource
metadata:
  name: venue-db
  owner: subagentes
spec:
  type: postgres
  version: "16"
  port: "5432"
  outputs:
    - name: host
    - name: port
    - name: password
      generated: true
    - name: url
      template: "postgres://postgres:{{.password}}@{{.host}}:{{.port}}/venues"
