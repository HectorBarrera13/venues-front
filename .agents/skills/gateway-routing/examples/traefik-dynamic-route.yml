# ~/manifests/traefik/dynamic/sap-atitos-booking.yml
# Operator-owned dynamic Traefik route configuration with custom security middlewares

http:
  middlewares:
    booking-ratelimit:
      rateLimit:
        average: 100
        burst: 50
    booking-security-headers:
      headers:
        customResponseHeaders:
          X-Frame-Options: "DENY"
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"
    booking-stripprefix:
      stripPrefix:
        prefixes:
          - "/booking"

  routers:
    booking-router:
      rule: "Host(`gateway.tail9a6ddb.ts.net`) && PathPrefix(`/booking`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - booking-stripprefix
        - booking-ratelimit
        - booking-security-headers
      service: booking-service

  services:
    booking-service:
      loadBalancer:
        servers:
          - url: "http://sap-atitos.booking:8080"
