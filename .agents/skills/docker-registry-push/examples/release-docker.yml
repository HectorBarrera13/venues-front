name: Release Image & Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  docker-image:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Tailscale OIDC authentication

    env:
      REGISTRY_HOST: gateway.tail9a6ddb.ts.net
      REGISTRY: gateway.tail9a6ddb.ts.net:5000
      IMAGE_NAME: subagentes-venue-service   # Team SubAgentes: <team>-<service> convention

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Allow insecure registry inside the GitHub runner's docker daemon
      - name: Allow the tailnet registry over HTTP
        shell: bash
        run: |
          current=$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)
          [ -n "$current" ] || current='{}'
          jq --arg registry "$REGISTRY" '."insecure-registries" += [$registry]' <<< "$current" \
            | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker

      # 2. Buildx using "driver: docker" so it respects daemon.json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # 3. Generate Semantic Version tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # 4. Build image BEFORE joining the tailnet to isolate third-party build scripts
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      # 5. Join the private Tailscale network
      - name: Join Tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          tags: tag:ci
          ping: ${{ env.REGISTRY_HOST }}

      # 6. Authenticate with the homelab registry
      - name: Login to Homelab Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      # 7. Push all generated tags
      - name: Push image tags
        run: docker push --all-tags "$REGISTRY/$IMAGE_NAME"
