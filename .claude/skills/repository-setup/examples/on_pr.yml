name: PR Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code linting & formatting checks
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Verify headless OpenAPI export (Backend Services)
        run: |
          if npm run | grep -q 'openapi:generate'; then
            npm run openapi:generate
            test -f openapi.json -o -f openapi.yaml
          fi
